# station1 with the two grippers in swapped hands (2026-11-21): tag_tracking_station1.yaml with robot_index
# swapped; body names stay (right_cube / left_cube = the physical cubes, as in the setup calibration).
# setup_station1_hands_swapped/ = setup_station1/ with robot_index swapped in gripper_tcp.json.
# Tag tracking config for station1 (2026-11-18), see umi/tag_tracking/config.py.
# New environment (head_mapping); yesterday's right gripper (cube 2-5, camera C3501326029433)
# now in the left hand; a new right gripper (cube 8-11, fingers 6 / 7, camera C3501326500348).
# Tags per video from scripts_tag_tracking/inspect_tags.py.
aruco_config: aruco_config.yaml
corner_noise: corner_noise.json
gripper_config: gripper_config_station1.yaml

head_camera: C3501326502664
# setup calibration from the station1 tool_handling session (calibrate_setup.py), the left
# cube's shape from setup_20261116 (same cube; its tag 3 faces away from the head here):
# --body_shape left_cube=setup_20261116/bodies.json:right_cube
setup_calibration: setup_station1_hands_swapped
head_imu:
  cam_imu_calibration: openicc/head/cam_imu/cam_imu_calib_result_GX010298.json
  noise_setting: head_gopro12_wide_fisheye_setting_720.yaml
  imu_time_offset: gpmf
gripper_imu:
  C3501326500348:   # right hand (OpenICC cam376, 2026-11-18)
    cam_imu_calibration: openicc/cam376/cam_imu/cam_imu_calib_result_GX019252.json
    noise_setting: gopro12_wide_fisheye_setting_720_C3501326500348.yaml
    imu_time_offset: gpmf
  C3501326029433:   # left hand (OpenICC gripper2)
    cam_imu_calibration: openicc/gripper2/cam_imu/cam_imu_calib_result_GX019230.json
    noise_setting: gopro12_wide_fisheye_setting_720_C3501326029433.yaml
    imu_time_offset: gpmf
accuracy:
  position_std: 0.0061   # m
  rotation_std: 3.5      # deg
cameras:
  C3501326502664: openicc/head/cam/cam_calib_GX010297_fi_1.0.json
  C3501326500348: openicc/cam376/cam/cam_calib_GX019219_fi_1.0.json
  C3501326029433: openicc/gripper2/cam/cam_calib_GX019229_fi_1.0.json

bodies:
  environment:
    static: true
    # seen in station1 head_mapping.MP4 and the takes
    tags: [14, 15, 16, 17, 22, 23, 32, 33, 34]
  right_cube:
    tags: [8, 9, 10, 11]
    gripper_camera: C3501326500348
    robot_index: 1   # 2026-11-21: this gripper in the LEFT hand (UMI: 0 right, 1 left)
  left_cube:
    tags: [2, 3, 4, 5]
    gripper_camera: C3501326029433
    robot_index: 0   # 2026-11-21: this gripper in the RIGHT hand

# continuous takes: docked -> task -> docked. Episodes between dock periods
# (scripts_tag_tracking/00b_segment_episodes.py, rules: umi/tag_tracking/wrist_events.py),
# docking removed after tracking (03t_trim_docking.py), wrist clocks synchronized from
# motion (03s_sync_wrists.py). Bangs are optional (audio clock diagnostic only).
# Check new takes with scripts_tag_tracking/check_wrist_events.py
episodes:
  dock_tags: [14, 16]
  boundary: dock          # 'dock' (between dock periods) or 'bang' (first to last bang)
  dock_exit_distance: 0.45  # m, task = both cubes farther than this from the dock tags
  # idle: both wrist IMUs still and the head sees both cubes at the dock tags
  still_sec: 1.0          # s, stillness window
  gyro_still: 0.04        # rad/s, gyro RMS below this = still
  dock_distance: 0.35     # m, 3D cube center to a dock tag (docked ~0.2, held above the dock >= 0.55)
  min_dock_frames: 15     # head frames with the docked view that confirm idle
  # bang: spikes in both wrist IMUs at once + click in the head audio, not at the dock
  bang_accel: 5.0         # m/s^2, weaker of the two wrist spikes
  bang_tolerance: 0.02    # s, max time between the two wrist spikes, after the fitted clock drift
  bang_search_tolerance: 0.06  # s, wrist spikes paired within this before the drift fit
  bang_merge_sec: 0.5     # s, hits closer than this are one bang
  audio_ratio: 5.0        # head audio click level over its 1 s background
  audio_tolerance: 0.015  # s, click within this of wrist spike + lag
  audio_lag_search: 0.3   # s, spike-click pairs for the lag estimate (task1: 43 ms)
  lag_accel: 10.0         # m/s^2, spikes used for the lag estimate
  dock_window: 0.25       # s, no bang within this of a docked head view
  idle_margin: 1.0        # s, no bang this close to idle
  min_episode_sec: 3.0    # s, shorter episodes are rejected
  # export
  max_gap_sec: 0.25       # s, longest tracking gap inside an exported episode
