# Read by propose_station_config.py from session task01 2026-11-24 (gripper calibration GX010200 / GX010363,
# head mapping GX010621, first 180 s of 4 takes):
# cameras: head C3501326499367, right C3501326383059, left C3501326505698
# right finger tags 1 (image left) / 0 (image right); left finger tags 6 (image left) / 7 (image right)
# cubes [2, 3, 4, 5] and [8, 9, 10] (tag 11 seen once, 1.0 sides from 9: added to the 8-10 cube by hand)
# right wrist sees cube [8, 9, 10] 19%, left wrist sees cube [2, 3, 4, 5] 1%:
# cube [2, 3, 4, 5] on the right gripper, [8, 9, 10] on the left
# head mapping: environment tags [38, 39, 40, 41, 46, 47]
# WARNING head takes show environment-size tags not in the mapping: [44, 45] (not added: not in the map)
